<!doctype html>
<!-- Socialbrewery Video Studio composition (HyperFrames + GSAP). Generated from templates/composition.html.
     Edit the SCENES JSON below, or regenerate with create_video_project / update_video_project. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{W}}, height={{H}}" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
:root { {{CSS_VARS}} }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--bg); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--sans), sans-serif; color: var(--ink); }
.clip { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 3); padding: calc(var(--u) * 6); perspective: 1600px; opacity: 0; }
.kicker { font-family: var(--mono), monospace; font-size: calc(var(--u) * 2.2); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.headline { font-weight: 850; font-size: calc(var(--u) * var(--hsize)); line-height: 1.02; letter-spacing: -0.03em; text-align: center; max-width: 92%; }
.headline .w { display: inline-block; }
.headline .hl { color: var(--accent); }
.kicker, .headline, .sub { position: relative; z-index: 2; }
.sub { font-size: calc(var(--u) * 2.8); color: var(--muted); text-align: center; max-width: 85%; }
.shot { position: relative; width: var(--shotw); border-radius: calc(var(--u) * 1.6); overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55); background: var(--card); transform-style: preserve-3d; }
.shot img { display: block; width: 100%; height: auto; }
.label { position: absolute; right: 12px; bottom: 10px; font: 600 14px var(--mono), monospace; letter-spacing: .1em; color: var(--muted); background: rgba(0,0,0,.5); padding: 4px 8px; border-radius: 6px; }
.slats { position: absolute; inset: 0; display: flex; pointer-events: none; }
.slats i { flex: 1; background: var(--bg); transform-origin: top; }
.btn { display: inline-block; background: var(--button); color: var(--buttonText); font-weight: 750; font-size: calc(var(--u) * 2.8); padding: calc(var(--u) * 1.6) calc(var(--u) * 3.6); border-radius: 999px; white-space: nowrap; }
.pillars { position: relative; width: var(--shotw); height: calc(var(--u) * 40); transform-style: preserve-3d; display: flex; align-items: flex-end; justify-content: center; gap: calc(var(--u) * 3); }
.pillar { position: relative; width: calc(var(--u) * 7); background: var(--accent); transform-origin: bottom; transform-style: preserve-3d; }
.pillar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 7); background: var(--button); transform: rotateX(90deg); transform-origin: top; }
.pillar::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: calc(var(--u) * 7); background: color-mix(in srgb, var(--accent) 70%, black); transform: rotateY(90deg); transform-origin: right; }
.loader { width: calc(var(--u) * 12); height: calc(var(--u) * 12); position: relative; }
.loader b { position: absolute; inset: 0; border-radius: 50%; border: calc(var(--u) * .8) solid transparent; border-top-color: var(--accent); }
.loader b:nth-child(2) { inset: 18%; border-top-color: var(--button); }
.loader b:nth-child(3) { inset: 36%; border-top-color: var(--ink); }
.question { font-weight: 800; font-size: calc(var(--u) * 4.4); text-align: center; max-width: 88%; }
.url { font-family: var(--mono), monospace; font-size: calc(var(--u) * 2.2); color: var(--muted); }
#line { position: absolute; left: 0; top: 50%; height: 6px; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; }
.caption { position: absolute; left: 0; right: 0; top: auto; bottom: var(--capy); padding: 0 calc(var(--u) * 4); text-align: center; font-weight: 850; font-size: calc(var(--u) * 3.6); text-shadow: 0 4px 18px rgba(0,0,0,.8); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-fps="30" data-width="{{W}}" data-height="{{H}}">
  <div id="bg" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0"></div>
  <div id="stage" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="1">
{{SCENES_HTML}}
    <div id="line"></div>
  </div>
{{AUDIO}}
</div>
<script id="spec" type="application/json">{{SPEC_JSON}}</script>
<script>
(function () {
  var spec = JSON.parse(document.getElementById('spec').textContent);
  var tl = gsap.timeline({ paused: true });
  var t = 0;
  spec.scenes.forEach(function (s, i) {
    var el = document.getElementById('s' + i);
    var shot = el.querySelector('.shot');
    var words = el.querySelectorAll('.headline .w');
    var d = s.duration;
    var fx = s.effect || 'focus';
    tl.set(el, { opacity: 1 }, t);
    if (fx === 'zoom-through' && i > 0) tl.from(el, { scale: 1.08, duration: 0.5, ease: 'power3.out' }, t);
    else if (fx === 'rack') tl.from(el, { filter: 'blur(14px)', scale: 0.96, duration: 0.75, ease: 'power2.inOut' }, t);
    var slats = el.querySelectorAll('.slats i');
    if (slats.length) tl.to(slats, { scaleY: 0, duration: 0.45, stagger: 0.04, ease: 'power3.inOut' }, t);
    if (words.length) tl.from(words, { y: 80, opacity: 0, duration: 0.3, stagger: 0.07, ease: 'expo.out' }, t + 0.1);
    var sub = el.querySelector('.sub'); if (sub) tl.from(sub, { y: 30, opacity: 0, duration: 0.4, ease: 'power3.out' }, t + 0.35);
    if (shot) {
      if (fx === 'hinge') tl.from(shot, { rotationX: -70, transformOrigin: '50% 100%', opacity: 0, duration: 0.7, ease: 'power3.out' }, t + 0.2);
      else tl.from(shot, { y: 60, rotationY: 6, opacity: 0, duration: 0.6, ease: 'power3.out' }, t + 0.2);
      var f = s.focus || { x: 50, y: 50, scale: 1.6 };
      tl.to(shot, { scale: f.scale || 1.6, transformOrigin: f.x + '% ' + f.y + '%', duration: Math.min(1.4, d * 0.35), ease: 'power2.inOut' }, t + Math.max(0.9, d * 0.35));
    }
    var pillars = el.querySelectorAll('.pillar');
    if (pillars.length) {
      var box = el.querySelector('.pillars');
      tl.from(pillars, { scaleY: 0, duration: 0.6, stagger: 0.06, ease: 'back.out(1.4)' }, t + 0.2);
      tl.to(box, { rotationX: 55, rotationZ: -35, duration: 0.9, ease: 'power2.inOut' }, t + 0.5);
      tl.to(box, { rotationZ: -15, duration: Math.max(0.6, d - 2), ease: 'none' }, t + 1.4);
    }
    var loader = el.querySelectorAll('.loader b');
    if (loader.length) tl.to(loader, { rotation: '+=720', duration: d, ease: 'none', stagger: 0.1 }, t);
    var btn = el.querySelector('.btn'); if (btn) tl.from(btn, { scale: 0.6, opacity: 0, duration: 0.5, ease: 'back.out(1.7)' }, t + 0.6);
    var q = el.querySelector('.question'); if (q) tl.from(q, { y: 40, opacity: 0, duration: 0.5, ease: 'power3.out' }, t + Math.min(1.6, d * 0.4));
    var next = spec.scenes[i + 1];
    if (next && next.effect === 'zoom-through') tl.to(el, { scale: 8, opacity: 0, duration: 0.4, ease: 'power3.in' }, t + d - 0.4);
    else if (next && next.effect === 'shutter') {
      tl.to(el, { scaleY: 0.004, duration: 0.35, ease: 'power3.in' }, t + d - 0.5);
      tl.fromTo('#line', { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power2.out' }, t + d - 0.6);
      tl.to('#line', { opacity: 0, duration: 0.2 }, t + d);
    } else if (next) tl.to(el, { opacity: 0, y: -20, duration: 0.25, ease: 'power2.in' }, t + d - 0.25);
    t += d;
  });
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
})();
</script>
</body>
</html>
